[package]
name = "openh264rs"
version = "0.1.0"
edition = "2024"
description = "Rust port of Cisco OpenH264 (H.264/AVC encoder and decoder)"
license = "BSD-3-Clause AND BSD-2-Clause"
readme = "README.md"
repository = "https://chromium.googlesource.com/chromium/third_party/openh264rs"

# `rlib` is what the tests and benches link; `cdylib` is what a C consumer `dlopen`s,
# exporting exactly upstream's seven symbols; `staticlib` is the same object set for a
# consumer that links rather than loads.
[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
cxx = { version = "1.0", optional = true }

[build-dependencies]
cxx-build = { version = "1.0", optional = true }

[features]
default = ["c-api", "cxx-api"]
# Raw C ABI vtables (`ISVCEncoderVtbl`, `ISVCDecoderVtbl`), thunks, and `#[no_mangle]`
# exports (`WelsCreateSVCEncoder`, `WelsCreateDecoder`, etc.) matching `codec_api.h`.
c-api = []
# Self-contained C++ bridge generated via `cxx` under `namespace openh264rs`.
cxx-api = ["dep:cxx", "dep:cxx-build"]
# The scalar build. The reference has no runtime way to turn its SIMD off, so this is
# that switch: it points `simd::kernels` at `src/simd/scalar/`, which forwards every
# entry point to the scalar body, and clears the feature word so the `pfXxx` tables
# install the scalar directly.
scalar = []

[[bench]]
name = "encode_bench"
harness = false
required-features = ["c-api"]

# Per-kernel scalar / intrinsics timing.
[[bench]]
name = "kernel_bench"
harness = false

[[bench]]
name = "decode_1080p_bench"
harness = false
required-features = ["c-api"]

