# This is a DSP codec, and unoptimised it decodes like one: at Cargo's default
# `opt-level = 0` a single 1280x720 CABAC conformance asset took 62s, and the large
# `VID_*_temporal_direct` streams were the whole of the debug suite's tail. `opt-level =
# 3` cuts that to 4.5s for a few seconds of extra build time.
#
# Both check flags stay on, and they are the reason a debug test run exists at all:
# `overflow-checks` turns a C++ signed overflow into a loud Rust panic, and
# `debug-assertions` keeps the `debug_assert!` sites live. They cost about 1.4x against
# release — cost worth keeping, and never to be traded away for speed.
#
# `[profile.bench]` inherits from `release`, not from here, so benchmark numbers are
# untouched. `rust_enc` is its own workspace root with its own identical profile.
#
# One consequence to watch: a debug build running at near-release speed widens every
# thread window, so a load-sensitive race that the old pace held shut can appear here.
# `multithread_decoder_test` is the exposed surface.
[profile.dev]
opt-level = 3
debug-assertions = true
overflow-checks = true

# Clippy lints that argue with C-shaped code: index loops, wide signatures, C-shaped
# conditionals and declaration-before-assignment.
[lints.clippy]
needless_range_loop = "allow"
collapsible_if = "allow"
too_many_arguments = "allow"
manual_range_contains = "allow"
derivable_impls = "allow"
field_reassign_with_default = "allow"
identity_op = "allow"
missing_safety_doc = "allow"
needless_late_init = "allow"
manual_is_multiple_of = "allow"
int_plus_one = "allow"
explicit_counter_loop = "allow"
neg_multiply = "allow"
if_same_then_else = "allow"
type_complexity = "allow"
# `drop()` here ends a borrow so the next statement can reborrow; the type not
# being Drop is the point, not a mistake.
drop_non_drop = "allow"
# The explicit zero-guard is deliberate; `Result<_, ()>` is right when the only
# failure is an allocation; boxing the big variant adds a per-frame allocation;
# renaming `as_mut` ripples; the literal groupings mark bitstream field edges.
manual_checked_ops = "allow"
result_unit_err = "allow"
large_enum_variant = "allow"
should_implement_trait = "allow"
unusual_byte_groupings = "allow"
